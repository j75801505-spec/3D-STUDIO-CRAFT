<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Studio Craft</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101522;color:white;font-family:Arial}
header{background:#1b2940;padding:15px;color:#54d7ff;font-size:20px;font-weight:bold}
main{display:flex;height:85vh}
aside{width:125px;background:#192338;padding:8px}
button{background:#263d5c;color:white;border:0;border-radius:7px;padding:10px;margin:4px 0;width:100%}
#view{flex:1;display:flex;align-items:center;justify-content:center;perspective:600px}
#cube{width:110px;height:110px;background:#24a9df;border:3px solid white;transform-style:preserve-3d;animation:spin 8s infinite linear}
@keyframes spin{from{transform:rotateX(0) rotateY(0)}to{transform:rotateX(360deg) rotateY(360deg)}}
footer{background:#1b2940;padding:12px}
</style>
</head>
<body>
<header>◆ 3D STUDIO CRAFT</header>
<main>
<aside>
<button onclick="add()">+ Cubo</button>
<button onclick="change()">🎨 Pintar</button>
<button onclick="rotate()">⟳ Girar</button>
<button onclick="save()">Salvar</button>
</aside>
<section id="view">
<div id="cube"></div>
</section>
</main>
<footer>Editor 3D | Projeto 1.0 | Modo offline</footer>
<script>
let rotation=0;
function add(){
let c=document.createElement('div');
c.id='cube';
c.style.margin='15px';
document.getElementById('view').appendChild(c);
}
function change(){
document.querySelectorAll('#cube').forEach(c=>{
c.style.background='#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');
});
}
function rotate(){
rotation+=45;
document.querySelectorAll('#cube').forEach(c=>{
c.style.animation='none';
c.style.transform='rotateX('+rotation+'deg) rotateY('+rotation+'deg)';
});
}
function save(){
let data={rotation:rotation};
let a=document.createElement('a');
a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
a.download='projeto-3d.json';
a.click();
}
</script>
</body>
</html>
